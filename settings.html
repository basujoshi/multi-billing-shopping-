<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings</title><link rel="stylesheet" href="css/style.css"></head><body><header><b>Settings</b><nav><a href="dashboard.html">Dashboard</a></nav></header><main class="container"><div class="panel"><h1>Account Settings</h1><p id="email"></p><button id="logout" class="ghost">Logout</button></div></main><script type="module">import{auth}from'./js/firebase-config.js';import{onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';onAuthStateChanged(auth,u=>{if(!u)location.href='login.html';else document.querySelector('#email').textContent=u.email});document.querySelector('#logout').onclick=()=>signOut(auth).then(()=>location.href='login.html');</script></body></html>
