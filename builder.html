<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Builder</title><link rel="stylesheet" href="css/style.css"></head>
<body><header><b>Website Builder</b><nav><a href="dashboard.html">Dashboard</a><button id="saveTop" class="btn">Save</button></nav></header>
<main class="builder"><section class="editor">
<div class="section"><h2>👤 Personal</h2><label>Name<input id="name"></label><label>Username<input id="username" pattern="[a-zA-Z0-9_-]{3,30}"><small>3–30 letters, numbers, dash or underscore.</small></label><label>Job / Profession<input id="job"></label><label>Location<input id="location"></label><label>About Me<textarea id="about"></textarea></label></div>
<div class="section"><h2>💼 Work & Life</h2><label>Experience<input id="experience"></label><label>Education<input id="education"></label><label>Skills<input id="skills" placeholder="Sales, Communication, Design"></label><label>Lifestyle / Hobbies<textarea id="lifestyle"></textarea></label></div>
<div class="section"><h2>🖼️ Profile Photo</h2><input id="photoFile" type="file" accept="image/*"><img id="photoPreview" class="upload-preview"><small>Maximum 5 MB. Photo is uploaded to Firebase Storage.</small></div>
<div class="section"><h2>🔗 Social & Contact</h2><label>Phone / WhatsApp<input id="phone"></label><label>Email<input id="contactEmail" type="email"></label><label>Facebook<input id="facebook"></label><label>Instagram<input id="instagram"></label><label>YouTube<input id="youtube"></label><label>LinkedIn<input id="linkedin"></label></div>
<div class="section"><h2>🎨 Design</h2><select id="template"><option value="modern">Modern</option><option value="dark">Dark</option><option value="matrix">Matrix</option><option value="minimal">Minimal</option></select><label class="check"><input id="published" type="checkbox"> Publish website publicly</label><button id="save" class="btn full">Save & Publish</button><p id="msg" class="msg"></p></div>
</section><section class="preview-wrap"><div class="preview-label">LIVE PREVIEW</div><iframe id="preview"></iframe></section></main>
<script type="module" src="js/builder.js"></script></body></html>
