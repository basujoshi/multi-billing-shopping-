<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="auth"><div class="panel"><h1>Create account</h1><p>Make your own website.</p>
<form id="signupForm"><input id="name" required placeholder="Full name"><input id="email" type="email" required placeholder="Email"><input id="password" type="password" minlength="6" required placeholder="Password"><input id="username" required pattern="[a-zA-Z0-9_-]{3,30}" placeholder="Username e.g. aakash-joshi"><button class="btn full">Create Account</button></form>
<p id="msg" class="msg"></p><a href="login.html">Already have an account? Login</a></div></div><script type="module" src="js/signup.js"></script></body></html>
