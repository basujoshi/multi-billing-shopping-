<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Settings - Billing</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:30px auto;padding:0 16px}.top{background:linear-gradient(135deg,#0b76ff,#6b38ff);color:#fff;padding:24px;border-radius:20px;box-shadow:0 12px 35px #0002}.top h1{margin:0 0 6px}.top p{margin:0;opacity:.9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 7px 25px #00000010}.card h2{font-size:18px;margin:0 0 16px}.field{margin-bottom:13px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #d9dfeb;border-radius:10px;font-size:14px}.field textarea{min-height:80px;resize:vertical}.checks{display:grid;gap:10px}.checks label{display:flex;gap:9px;align-items:center}.preview{display:flex;gap:16px;align-items:center;border:1px dashed #ccd5e5;padding:16px;border-radius:14px}.preview img{width:80px;height:80px;object-fit:contain;border-radius:12px;border:1px solid #eee}.actions{position:sticky;bottom:12px;margin-top:18px;display:flex;gap:10px}.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:700;cursor:pointer}.save{background:#087cff;color:#fff}.back{background:#e9eef7;color:#172033}.status{margin-top:12px;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{margin:15px auto}}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="firebase-config.js"></script>
<script src="shop-settings.js"></script>
</head>
<body>
<div class="wrap">
<div class="top"><h1>Shop Settings</h1><p>Master settings — saved details are used across billing, return, reprint and print pages.</p></div>
<div class="grid">
<div class="card"><h2>Shop Information</h2>
<div class="field"><label>Shop Name</label><input id="shopName"></div><div class="field"><label>Owner Name</label><input id="ownerName"></div><div class="field"><label>Branch</label><input id="branch"></div><div class="field"><label>Address</label><textarea id="address"></textarea></div><div class="field"><label>City</label><input id="city"></div><div class="field"><label>State</label><input id="state"></div><div class="field"><label>Country</label><input id="country"></div><div class="field"><label>PIN / Postal Code</label><input id="pin"></div>
</div>
<div class="card"><h2>Contact & Tax</h2><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>WhatsApp</label><input id="whatsapp"></div><div class="field"><label>Email</label><input id="email"></div><div class="field"><label>Website / Online Shop</label><input id="website"></div><div class="field"><label>GST / Registration No.</label><input id="gstNo"></div><div class="field"><label>UPI ID</label><input id="upiId"></div></div>
<div class="card"><h2>Print & Invoice</h2><div class="field"><label>Logo URL</label><input id="logoUrl" placeholder="https://..."></div><div class="field"><label>QR Image URL</label><input id="qrUrl" placeholder="https://..."></div><div class="field"><label>QR Text</label><input id="qrText"></div><div class="field"><label>Invoice Footer</label><textarea id="invoiceFooter"></textarea></div><div class="field"><label>Return Policy</label><textarea id="returnPolicy"></textarea></div><div class="field"><label>General Footer</label><input id="footer"></div><div class="checks"><label><input type="checkbox" id="showLogo"> Show logo on print</label><label><input type="checkbox" id="showQR"> Show QR on print</label><label><input type="checkbox" id="showGST"> Show GST on print</label><label><input type="checkbox" id="showAddress"> Show address on print</label></div></div>
<div class="card"><h2>Live Preview</h2><div class="preview"><img id="previewLogo" src="" alt="Logo"><div><div id="previewName" style="font-size:20px;font-weight:800">My Shop</div><div id="previewOwner"></div><div id="previewPhone"></div><div id="previewAddress"></div><div id="previewGST"></div></div></div><div class="status" id="status"></div></div>
</div>
<div class="actions"><button class="btn save" onclick="saveSettings()">Save Shop Settings</button><button class="btn back" onclick="history.back()">Back</button></div>
</div>
<script>
const fields=['shopName','ownerName','logoUrl','qrUrl','branch','address','city','state','country','pin','phone','whatsapp','email','website','gstNo','upiId','footer','returnPolicy','invoiceFooter','qrText'];
function fill(s){fields.forEach(k=>{const e=document.getElementById(k);if(e)e.value=s[k]||''});['showLogo','showQR','showGST','showAddress'].forEach(k=>document.getElementById(k).checked=s[k]!==false);preview(s)}
function collect(){const s={};fields.forEach(k=>s[k]=document.getElementById(k).value.trim());['showLogo','showQR','showGST','showAddress'].forEach(k=>s[k]=document.getElementById(k).checked);return s}
function preview(s){document.getElementById('previewName').textContent=s.shopName||'My Shop';document.getElementById('previewOwner').textContent=s.ownerName?'Owner: '+s.ownerName:'';document.getElementById('previewPhone').textContent=s.phone?'Phone: '+s.phone:'';document.getElementById('previewAddress').textContent=s.address||'';document.getElementById('previewGST').textContent=s.gstNo?'GST: '+s.gstNo:'';const im=document.getElementById('previewLogo');im.src=s.logoUrl||'';im.style.display=s.showLogo===false?'none':''}
async function saveSettings(){try{const s=collect();await ShopSettings.save(s);fill(s);document.getElementById('status').textContent='✓ Settings saved successfully. Other pages will use these details.'}catch(e){document.getElementById('status').textContent='Save error: '+e.message}}
document.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>fill(ShopSettings.get()),300);fields.forEach(k=>document.getElementById(k)?.addEventListener('input',()=>preview(collect())));['showLogo','showQR','showGST','showAddress'].forEach(k=>document.getElementById(k).addEventListener('change',()=>preview(collect())))});
</script>
</body></html>
